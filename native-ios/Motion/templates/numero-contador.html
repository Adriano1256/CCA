<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../lib/base.css"><style>.bg{background:#0a0d14}.box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 7vw;gap:1.5vmin}#n{font-family:Anton;font-size:30vmin;line-height:1;color:var(--c1)}#t{font-weight:800;font-size:6vmin;color:#fff}.b{width:0;height:1vmin;background:var(--c1);margin-top:2vmin}</style>
<script src="../lib/gsap.min.js"></script><script src="../lib/runtime.js"></script><script>window.VARS={{VARS_JSON}};</script><script src="../lib/kit.js"></script>
</head><body><div id="stage" data-composition-id="numero-contador" data-duration="{{DURATION}}"><div class="fill bg" id="bg"></div><div class="box"><div id="n">0</div><div id="t"></div><div class="b" id="b"></div></div></div>
<script>cssVars();var D=parseFloat(document.getElementById('stage').dataset.duration);var tl=comp(D);txt('t','titulo','quilômetros de asfalto');var goal=parseFloat(String(val('numero','120')).replace(',','.'))||0;var o={v:0};var nE=document.getElementById('n');var dec=String(val('numero','120')).match(/[.,](\d+)/);var fx=dec?dec[1].length:0;tl.to(o,{v:goal,duration:Math.max(.6,D-1),ease:'power2.out',onUpdate:function(){nE.textContent=o.v.toLocaleString('pt-BR',{minimumFractionDigits:fx,maximumFractionDigits:fx})}},.1);tl.from('#t',{y:'3vmin',opacity:0,duration:.45},.35);tl.to('#b',{width:'50vmin',duration:Math.max(.6,D-1),ease:'power2.out'},.1);tl.set({},{},D);</script></body></html>
