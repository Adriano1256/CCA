<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../lib/base.css"><style>.bg{background:#0c0c10}.box{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 7vw}.p{width:100%;border:.25vmin solid #ffffff33;border-radius:2.4vmin;background:#17171d;padding:4vmin;font-weight:500;font-size:4.6vmin;line-height:1.3;color:#fff;min-height:26vmin}#c{display:inline-block;width:.5vmin;height:5vmin;background:#C6FF34;vertical-align:middle;margin-left:.6vmin}</style>
<script src="../lib/gsap.min.js"></script><script src="../lib/runtime.js"></script><script>window.VARS={{VARS_JSON}};</script><script src="../lib/kit.js"></script>
</head><body><div id="stage" data-composition-id="digitando" data-duration="{{DURATION}}"><div class="fill bg"></div><div class="box"><div class="p" id="p"><span id="t"></span><span id="c"></span></div></div></div>
<script>cssVars();var D=parseFloat(document.getElementById('stage').dataset.duration);var tl=comp(D);var full=String(val('titulo','Monte um vídeo institucional da obra'));var o={n:0};var e=document.getElementById('t');tl.from('#p',{scale:.9,opacity:0,duration:.35,ease:'back.out(1.6)'},0);tl.to(o,{n:full.length,duration:Math.max(.5,D*.65),ease:'none',onUpdate:function(){e.textContent=full.slice(0,Math.round(o.n))}},.3);for(var i=0;i<Math.floor(D*2);i++){tl.set('#c',{opacity:i%2?1:0},i*.5)};tl.set({},{},D);</script></body></html>
