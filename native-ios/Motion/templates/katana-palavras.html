<link rel="stylesheet" href="../lib/base.css"><style>.bg{background:#050505}.line{position:absolute;left:0;right:0;top:50%;height:.5vmin;background:#E4183C;transform-origin:left}#w{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Archivo;font-size:15vmin;letter-spacing:-.02em;text-transform:uppercase;text-align:center;padding:0 5vw;color:#E8EDF0}#w .word{position:absolute;opacity:0}#w .word:nth-child(even){color:#E4183C}</style>

</head><body><div id="stage" data-composition-id="katana-palavras" data-duration="{{DURATION}}"><div class="fill bg"></div><div class="line" id="l"></div><div id="w"></div></div>
<script>cssVars();var D=parseFloat(document.getElementById('stage').dataset.duration);var tl=comp(D);var e=document.getElementById('w');var L=String(val('titulo','FEITO PARA VOCÊ')).trim().split(/\s+/);var step=(D-.3)/L.length;L.forEach(function(t,i){var s=document.createElement('span');s.className='word';s.textContent=t;e.appendChild(s);var a=i*step;tl.fromTo(s,{opacity:0,scale:2.6,filter:'blur(12px)'},{opacity:1,scale:1,filter:'blur(0px)',duration:.16,ease:'power4.out'},a);tl.to(s,{scale:.94,duration:step-.2,ease:'none'},a+.16);tl.to(s,{opacity:0,duration:.04},a+step-.04)});tl.fromTo('#l',{scaleX:0},{scaleX:1,duration:D,ease:'none'},0);tl.set({},{},D);</script></body></html>
