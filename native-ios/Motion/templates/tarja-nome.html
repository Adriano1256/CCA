<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../lib/base.css"><style>.wrap{position:absolute;left:6vw;bottom:13%;display:flex;flex-direction:column;align-items:flex-start;max-width:86vw}.n{background:var(--c1);color:var(--c2);font-weight:800;font-size:5vmin;padding:1.4vmin 3vmin;transform-origin:left}.c{background:#fff;color:#111;font-weight:500;font-size:3.1vmin;padding:1vmin 3vmin;transform-origin:left}.n span,.c span{display:block}</style>
<script src="../lib/gsap.min.js"></script><script src="../lib/runtime.js"></script><script>window.VARS={{VARS_JSON}};</script><script src="../lib/kit.js"></script>
</head><body><div id="stage" data-composition-id="tarja-nome" data-duration="{{DURATION}}"><div class="wrap"><div class="n" id="nb"><span id="n"></span></div><div class="c" id="cb"><span id="c"></span></div></div></div>
<script>cssVars();var D=parseFloat(document.getElementById('stage').dataset.duration);var tl=comp(D);txt('n','titulo','Nome da pessoa');txt('c','subtitulo','Cargo ou comunidade');tl.from('#nb',{scaleX:0,duration:.4,ease:'power3.out'},.05);tl.from('#n',{opacity:0,x:'-2vmin',duration:.3},.25);tl.from('#cb',{scaleX:0,duration:.35,ease:'power3.out'},.25);tl.from('#c',{opacity:0,x:'-2vmin',duration:.3},.42);tl.to('#nb,#cb',{scaleX:0,transformOrigin:'right',duration:.3,ease:'power3.in'},D-.32);tl.to('#n,#c',{opacity:0,duration:.12},D-.34);tl.set({},{},D);</script></body></html>
