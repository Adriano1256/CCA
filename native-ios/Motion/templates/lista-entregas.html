<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../lib/base.css"><style>.bg{background:#0d1117}.box{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:3vmin;padding:0 9vw}#t{font-weight:800;font-size:7vmin;color:var(--c1);margin-bottom:2vmin}.i{display:flex;align-items:center;gap:2.6vmin;font-weight:500;font-size:4.6vmin;color:#fff}.k{flex:none;width:5.4vmin;height:5.4vmin;border-radius:50%;background:var(--c1);color:var(--c2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:3.4vmin}</style>
<script src="../lib/gsap.min.js"></script><script src="../lib/runtime.js"></script><script>window.VARS={{VARS_JSON}};</script><script src="../lib/kit.js"></script>
</head><body><div id="stage" data-composition-id="lista-entregas" data-duration="{{DURATION}}"><div class="fill bg"></div><div class="box" id="box"><div id="t"></div></div></div>
<script>cssVars();var D=parseFloat(document.getElementById('stage').dataset.duration);var tl=comp(D);txt('t','titulo','O que foi feito');var items=String(val('subtitulo','Item 1; Item 2; Item 3')).split(/;|\n/).map(function(x){return x.trim()}).filter(Boolean).slice(0,6);var b=document.getElementById('box');var step=Math.min(.6,(D-1.2)/Math.max(1,items.length));items.forEach(function(x,i){var r=document.createElement('div');r.className='i';var k=document.createElement('div');k.className='k';k.textContent='✓';var s=document.createElement('span');s.textContent=x;r.appendChild(k);r.appendChild(s);b.appendChild(r);tl.from(r,{x:'-8vmin',opacity:0,duration:.4,ease:'power3.out'},.5+i*step);tl.from(k,{scale:0,duration:.35,ease:'back.out(3)'},.6+i*step)});tl.from('#t',{y:'3vmin',opacity:0,duration:.4},.1);tl.set({},{},D);</script></body></html>
