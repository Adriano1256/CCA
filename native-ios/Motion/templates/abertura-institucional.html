<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../lib/base.css"><style>.bg{background:var(--c1)}.bar{position:absolute;left:0;right:0;background:var(--c2);height:1vmin}#a{top:0;transform-origin:left}#b{bottom:0;transform-origin:right}.box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8vw;gap:3vmin}#lg{max-width:34vmin;max-height:22vmin;object-fit:contain}#t{font-weight:800;font-size:9vmin;line-height:1.08;color:var(--c2)}#s{font-weight:500;font-size:4vmin;color:var(--c2);opacity:.85}</style>
