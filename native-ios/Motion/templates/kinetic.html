<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../lib/base.css"><style>
#bg{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1.2vmin 2.6vmin;text-align:center;padding:0 7vw;opacity:0;perspective:110vmin}
.scene .word{position:relative;line-height:1.08}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom}.mask>span{display:inline-block}
.wipe{position:absolute;inset:0;transform-origin:left}
.mark{position:absolute;left:-.6vmin;right:-.6vmin;top:18%;bottom:8%;z-index:-1;transform-origin:left}
</style>
<script src="../lib/gsap.min.js"></script><script src="../lib/runtime.js"></script><script>window.VARS={{VARS_JSON}};</script><script src="../lib/kit.js"></script>
</head><body><div id="stage" data-composition-id="kinetic" data-duration="{{DURATION}}"><div id="bg"></div></div>
<script>
cssVars();
var D=parseFloat(document.getElementById('stage').dataset.duration);var tl=comp(D);
var C1=val('cor1','#FFD84D'),C2=val('cor2','#FFFFFF');
var FONTS={katana:['Archivo','uppercase'],impacto:['Anton','uppercase'],mola:['Mont','none'],cascata:['Anton','uppercase'],glitch:['Archivo','uppercase'],giro3d:['Anton','uppercase'],contorno:['Anton','uppercase'],marca:['Mont','none'],elegante:['Serif','none'],maquina:['Mont','none'],tremor:['Archivo','uppercase'],motionia:['Anton','uppercase'],doismundos:['Mont','none'],energia:['Anton','uppercase'],editorial:['Mont','none']};
var estilo=FONTS[val('estilo','impacto')]?val('estilo','impacto'):'impacto';
// Identidades visuais prontas: as cores não seguem o cliente.
if(estilo==='katana'){C1='#E4183C';C2='#EAF6FF'}
if(estilo==='motionia'){C1='#C6FF34';C2='#FFFFFF'}
function luz(h){var m=/^#?([0-9a-f]{6})$/i.exec(h);if(!m)return 0;var n=parseInt(m[1],16);return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255}
var fundo=val('fundo','');if(fundo){document.getElementById('bg').style.background=fundo}
// Cada frase vira uma cena; separe com | ou ponto final.
var frases=String(val('titulo','Seu texto aqui')).split(/\||(?<=[.!?])\s+/).map(function(x){return x.trim()}).filter(Boolean);
var slot=D/frases.length;
var rnd=seeded(42);
frases.forEach(function(frase,n){
  var s=document.createElement('div');s.className='scene';s.style.fontFamily=FONTS[estilo][0];s.style.textTransform=FONTS[estilo][1];
  if(estilo==='elegante')s.style.fontStyle='italic';
  var lista=frase.split(/\s+/);
  var tamanho=Math.max(7,Math.min(17,70/Math.sqrt(frase.length+4)));
  s.style.fontSize=tamanho+'vmin';s.style.fontWeight=FONTS[estilo][0]==='Mont'?800:400;
  document.getElementById('stage').appendChild(s);
  var w=lista.map(function(t,i){var e=document.createElement('span');e.className='word';e.textContent=t;e.style.color=(i%3===1)?C1:C2;e.style.textShadow=fundo?'none':'0 .5vmin 2vmin #000a';s.appendChild(e);return e});
  var a=n*slot, stag=Math.min(.16,(slot*.5)/lista.length);
  tl.set(s,{opacity:1},a);
  if(estilo==='energia'){ var cor=n%2?C2:C1,bgw=document.createElement('div');bgw.className='wipe';bgw.style.background=cor;s.parentNode.insertBefore(bgw,s);tl.set(bgw,{opacity:1},a);tl.fromTo(bgw,{scaleX:0},{scaleX:1,duration:.3,ease:'power4.inOut'},a);tl.set(bgw,{opacity:0},0);gsap.set(bgw,{opacity:0});tl.set(bgw,{opacity:1},a);if(n<frases.length-1){tl.set(bgw,{opacity:0},a+slot+.31)}var tom=luz(cor)>.55?'#111':'#fff';w.forEach(function(e){e.style.color=tom;e.style.textShadow='none'});s.style.fontSize=(tamanho*1.15)+'vmin';tl.from(w,{y:'14vmin',opacity:0,duration:.34,stagger:stag,ease:'power4.out'},a+.2); }
  else if(estilo==='editorial'){ s.style.justifyContent='flex-start';s.style.textAlign='left';s.style.padding='0 9vw';s.style.fontSize=(tamanho*.9)+'vmin';w.forEach(function(e,i){var t=e.textContent;e.textContent='';var m=document.createElement('span');m.className='mask';var inner=document.createElement('span');inner.textContent=t;m.appendChild(inner);e.appendChild(m);e.style.color=(i===lista.length-1)?C1:C2;tl.from(inner,{yPercent:115,duration:.62,ease:'power4.out'},a+.05+i*stag*1.4)}); }
  else if(estilo==='doismundos'){ w.forEach(function(e,i){if(i%2){e.style.fontFamily='Serif';e.style.fontStyle='italic';e.style.fontWeight=400;e.style.color=C1;e.style.fontSize='1.12em'}else{e.style.color=C2;e.style.fontWeight=800}});tl.from(w,{y:'5vmin',opacity:0,duration:.5,stagger:stag,ease:'power3.out'},a+.02); }
  else if(estilo==='motionia'){ var barra=document.createElement('div');barra.style.cssText='position:absolute;left:7vw;right:7vw;top:calc(50% + '+(tamanho*1.3)+'vmin);height:1vmin;background:#7F3AED;transform-origin:left';s.appendChild(barra);w.forEach(function(e,i){e.style.color=i%2?C1:C2});tl.from(barra,{scaleX:0,duration:.34,ease:'power4.inOut'},a+.05);tl.from(w,{y:'8vmin',scale:.86,opacity:0,duration:.3,stagger:stag,ease:'power4.out'},a+.08); }
  else if(estilo==='katana'){ s.style.fontSize=(tamanho*1.7)+'vmin';w.forEach(function(e,i){e.style.position='absolute';e.style.left='5vw';e.style.right='5vw';e.style.top='50%';e.style.color=i%3===1?C1:C2;gsap.set(e,{yPercent:-50,opacity:0})});var st=(slot-.15)/lista.length;w.forEach(function(e,i){tl.fromTo(e,{opacity:0,scale:2.6},{opacity:1,scale:1,duration:.14,ease:'power4.out'},a+i*st);tl.to(e,{opacity:0,duration:.03},a+(i+1)*st-.03)}); }
  else if(estilo==='mola'){ tl.from(w,{y:'9vmin',scale:.4,opacity:0,duration:.7,stagger:stag,ease:spring(170,12)},a+.02); }
  else if(estilo==='cascata'){ tl.from(w,{y:'-22vmin',opacity:0,duration:.5,stagger:stag,ease:'bounce.out'},a+.02); }
  else if(estilo==='glitch'){ w.forEach(function(e,i){var t0=a+i*stag;for(var k=0;k<6;k++){tl.set(e,{x:(rnd()-.5)*30,skewX:(rnd()-.5)*30,opacity:rnd()>.3?1:.2},t0+k*.035)}tl.set(e,{x:0,skewX:0,opacity:1},t0+.21);tl.set(e,{opacity:0},0)}); w.forEach(function(e){gsap.set(e,{opacity:0})}); }
  else if(estilo==='giro3d'){ tl.from(w,{rotationX:-95,y:'10vmin',opacity:0,transformOrigin:'50% 100%',duration:.55,stagger:stag,ease:'back.out(1.6)'},a+.02); }
  else if(estilo==='contorno'){ w.forEach(function(e,i){var c=i%3===1?C1:C2;e.style.webkitTextStroke='.3vmin '+c;e.style.color='rgba(255,255,255,0)';tl.from(e,{scale:1.5,opacity:0,duration:.35,ease:'power3.out'},a+.02+i*stag);tl.to(e,{color:c,duration:.25},a+.5+i*stag)}); }
  else if(estilo==='marca'){ w.forEach(function(e,i){e.style.color='#111';if(fundo===''){s.style.background='transparent'}var m=document.createElement('span');m.className='mark';m.style.background=i%2?C1:C2;e.appendChild(m);tl.from(m,{scaleX:0,duration:.28,ease:'power3.out'},a+i*stag);tl.from(e,{opacity:0,duration:.12},a+i*stag)}); }
  else if(estilo==='elegante'){ tl.from(w,{opacity:0,y:'2.4vmin',filter:'blur(10px)',duration:.6,stagger:stag*1.3,ease:'power2.out'},a+.02); }
  else if(estilo==='maquina'){ var cheio=frase;var box=document.createElement('span');s.textContent='';s.appendChild(box);var o={n:0};(function(b,txt,obj){tl.to(obj,{n:txt.length,duration:slot*.7,ease:'none',onUpdate:function(){b.textContent=txt.slice(0,Math.round(obj.n))}},a)})(box,cheio,o); }
  else if(estilo==='tremor'){ tl.from(w,{scale:2.4,opacity:0,duration:.16,stagger:stag,ease:'power4.in'},a+.02);tl.to(s,{keyframes:[{x:'1.2vmin',y:'-.8vmin',duration:.03},{x:'-1vmin',y:'.8vmin',duration:.03},{x:'.7vmin',y:'.4vmin',duration:.03},{x:0,y:0,duration:.03}]},a+.02+stag*lista.length); }
  else { tl.from(w,{scale:1.9,opacity:0,duration:.26,stagger:stag,ease:'power4.out'},a+.02); }
  if(n<frases.length-1){tl.set(s,{opacity:0},a+slot-.001)}
  tl.to(s,{opacity:0,duration:.14},a+slot-.14);
});
tl.set({},{},D);
</script></body></html>
