<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../lib/base.css"><style>.bg{background:var(--c1)}.box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3vmin;padding:0 8vw}#lg{max-width:46vmin;max-height:30vmin;object-fit:contain}#t{font-weight:800;font-size:7.5vmin;color:var(--c2)}#s{font-weight:500;font-size:3.6vmin;color:var(--c2);opacity:.85}.ring{position:absolute;left:50%;top:50%;width:70vmin;height:70vmin;margin:-35vmin;border:.6vmin solid var(--c2);border-radius:50%;opacity:.35}</style>
<script src="../lib/gsap.min.js"></script><script src="../lib/runtime.js"></script><script>window.VARS={{VARS_JSON}};</script><script src="../lib/kit.js"></script>
</head><body><div id="stage" data-composition-id="encerramento-logo" data-duration="{{DURATION}}"><div class="fill bg" id="bg"></div><div class="ring" id="r"></div><div class="box"><img id="lg" alt=""><div id="t"></div><div id="s"></div></div></div>
<script>cssVars();var D=parseFloat(document.getElementById('stage').dataset.duration);var tl=comp(D);logo('lg');txt('t','titulo','Prefeitura');txt('s','subtitulo','');tl.fromTo('#bg',{opacity:0},{opacity:1,duration:.35},0);tl.from('#r',{scale:.2,opacity:0,duration:.9,ease:'expo.out'},.1);tl.from('#lg',{scale:.6,opacity:0,duration:.6,ease:'back.out(1.8)'},.2);tl.from('#t',{y:'3vmin',opacity:0,duration:.45},.5);tl.from('#s',{y:'2vmin',opacity:0,duration:.4},.7);tl.set({},{},D);</script></body></html>
