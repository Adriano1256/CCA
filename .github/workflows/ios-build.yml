name: Gerar app para iPhone

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Uma execução de cada tipo por vez; a mais nova espera a anterior terminar.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Testes da lógica de edição
        run: tests/run.sh /tmp/editor-tests

      - name: Gerar projeto Xcode
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodegen generate --spec project.yml

      - name: Compilar para iPhone (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild -project EditorIA.xcodeproj -scheme EditorIA -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build-device.log 2>&1 || true
          grep -E 'error:|BUILD (SUCCEEDED|FAILED)' build-device.log | sort -u | head -80 || true
          # A pasta do app existe mesmo em build com erro; só vale se terminou e tem o executável.
          grep -q 'BUILD SUCCEEDED' build-device.log
          test -f build/Build/Products/Release-iphoneos/EditorIA.app/EditorIA

      - name: Criar arquivo IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/EditorIA.app Payload/
          zip -qry EditorIA.ipa Payload
          ls -lh EditorIA.ipa

      - name: Publicar IPA na página de Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}-${{ github.run_attempt }}" EditorIA.ipa \
            --title "Editor IA · build ${{ github.run_number }}" \
            --notes "IPA sem assinatura. Instale pelo Sideloadly (veja INSTALAR_NO_IPHONE.md)."
          # Mantém só a versão mais nova, para nunca baixar um arquivo antigo por engano.
          gh release list --limit 50 --json tagName --jq '.[].tagName' | grep -v "^build-${{ github.run_number }}-${{ github.run_attempt }}$" | while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Abrir o app no simulador, exportar de verdade e tirar prints
        continue-on-error: true
        timeout-minutes: 40
        run: |
          mkdir -p smoke
          tests/simulator-smoke.sh > smoke/run.log 2>&1

      - name: Publicar relatório da compilação
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/report
          grep -E 'error:|warning: unre|BUILD (SUCCEEDED|FAILED)' build-device.log | sort -u > /tmp/report/erros.txt || true
          tail -c 200000 build-device.log > /tmp/report/build-device.log 2>/dev/null || true
          cp build-sim.log /tmp/report/ 2>/dev/null || true
          cp -R smoke /tmp/report/smoke 2>/dev/null || true
          find /tmp/report/smoke \( -name '*.mov' -o -name '*.mp4' \) -delete 2>/dev/null || true
          ls -lh EditorIA.ipa > /tmp/report/ipa.txt 2>/dev/null || echo "sem ipa" > /tmp/report/ipa.txt
          cd /tmp/report
          git init -q -b ci-logs .
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A; git commit -q -m "Relatório ${{ github.sha }}" --no-gpg-sign
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" ci-logs

      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EditorIA-iPhone
          if-no-files-found: warn
          path: |
            EditorIA.ipa
            build-device.log
            build-sim.log
            smoke
