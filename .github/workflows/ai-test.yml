name: Testar a IA local

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-ios/EditorIA/AgentCore.swift'
      - 'native-ios/EditorIA/LocalLLM.swift'
      - 'tests/aitest/**'
      - '.github/workflows/ai-test.yml'

permissions:
  contents: write

# Uma execução de cada tipo por vez; a mais nova espera a anterior terminar.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Preparar
        run: |
          set -o pipefail
          mkdir -p ai-report tests/aitest/Sources/aitest
          cd tests/aitest
          N=../../native-ios/EditorIA
          cp main.swift.txt Sources/aitest/main.swift
          # MotionTemplate só precisa do formato do catálogo aqui.
          cat >> Sources/aitest/main.swift <<'SWIFT'

          struct MotionTemplate: Codable { var id: String }
          SWIFT
          for f in LocalLLM AgentCore CaptionPresets ProjectModel TimelineCore AudioDuckingPlanner DirectorPlanningCore DirectorTimelineMaterializer SceneEvaluator; do cp $N/$f.swift Sources/aitest/; done
          swift build -c release 2>&1 | tee ../../ai-report/compilacao.txt | tail -15
      - name: Rodar os modelos
        run: |
          mkdir -p ai-report
          for spec in "qwen|qwen|https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf" "gemma-e2b|gemma|https://huggingface.co/unsloth/gemma-4-E2B-it-qat-mobile-GGUF/resolve/main/gemma-4-E2B-it-qat-UD-Q2_K_XL.gguf" "gemma-12b|gemma|https://huggingface.co/unsloth/gemma-4-12b-it-GGUF/resolve/main/gemma-4-12b-it-UD-Q3_K_XL.gguf"; do
            NAME=${spec%%|*}; REST=${spec#*|}; FORMAT=${REST%%|*}; URL=${REST#*|}
            curl -sSL -o model.gguf "$URL"
            ls -lh model.gguf
            (cd tests/aitest && perl -e 'alarm 1500; exec @ARGV' ./.build/release/aitest ../../model.gguf "$FORMAT" 3) 2>"../../ai-report/$NAME-erros.txt" | tee "ai-report/$NAME.txt" || true
            rm -f model.gguf
          done
      - name: Publicar resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ai-report && cd ai-report
          git init -q -b ai-logs .
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A; git commit -q -m "IA ${{ github.sha }}" --no-gpg-sign --allow-empty
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" ai-logs
